<!DOCTYPE html>

<html>

<head>

    <title>Loan Calculator</title>

    <link rel="stylesheet"
          type="text/css"
          href="style.css">

</head>

<body>

<div class="container">

    <h1>Net Banking</h1>

    <h2>Loan Calculator</h2>

    <form action="LoanServlet" method="post">

        <label>Loan Amount</label>

        <input type="number"
               name="amount"
               required>

        <label>Interest Rate (%)</label>

        <input type="number"
               step="0.01"
               name="rate"
               required>

        <label>Loan Period (Years)</label>

        <input type="number"
               name="years"
               required>

        <button type="submit">
            Calculate
        </button>

    </form>

    <p class="message">
        <a href="dashboard.jsp">
            Back to Dashboard
        </a>
    </p>

</div>

</body>

</html>
